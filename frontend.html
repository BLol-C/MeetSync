<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MeetSync — ประชุมสด</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #4c8dff; --accent-d: #3a6fd8;
    --danger: #ff5c5c; --ok: #37c978;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 "Segoe UI", Tahoma, system-ui, sans-serif;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); }
  .dot.err { background: var(--danger); }
  form { display: flex; gap: 8px; flex: 1; min-width: 260px; }
  input[type=text] {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    border: 0; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; background: var(--accent); color: #fff;
  }
  button:hover { background: var(--accent-d); }
  button.ghost, a.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  a.ghost, a.primary {
    display: inline-block; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; text-decoration: none;
  }
  a.primary { background: var(--accent); color: #fff; }
  a.ghost:hover { background: var(--line); }
  .bar {
    padding: 8px 18px; font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .bar .hint { font-style: italic; }
  .steps {
    display: flex; gap: 4px; padding: 8px 18px; overflow-x: auto;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .step {
    font-size: 12px; color: var(--muted); padding: 4px 12px; border-radius: 999px;
    white-space: nowrap; background: var(--panel2); border: 1px solid var(--line);
  }
  .step.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .step.done { color: var(--ok); border-color: var(--ok); }
  .actionRow { display: flex; gap: 8px; padding: 0 0 16px; flex-wrap: wrap; }
  .actionRow[hidden] { display: none; }
  main { max-width: 900px; margin: 0 auto; padding: 18px; }
  .line { padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .line .who { color: var(--accent); font-weight: 600; }
  .line .ts { color: var(--muted); font-size: 12px; margin-right: 8px; }
  .line.interim .txt { color: var(--muted); }
  .line.raw .who { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .calBtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 400; cursor: pointer;
    margin-left: 6px; text-decoration: none; display: inline-block;
  }
  #headerMeta { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  #calStatus a { color: var(--accent); text-decoration: none; }
  #userBadge { display: flex; align-items: center; gap: 8px; }
  #userBadge img { width: 22px; height: 22px; border-radius: 50%; }
  #userBadge a { color: var(--accent); text-decoration: none; }
  #pastPanel {
    position: fixed; top: 0; right: 0; height: 100%; width: 340px; max-width: 88vw;
    margin: 0; padding: 16px; border: 1px solid var(--line); border-top: 0; border-bottom: 0;
    background: var(--panel2); box-shadow: -6px 0 20px rgba(0,0,0,.4); overflow-y: auto; z-index: 10;
  }
  #pastPanel h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  #pastPanel h2 .closeBtn {
    margin-left: auto; background: transparent; border: 0; color: var(--muted); font-size: 18px;
    line-height: 1; cursor: pointer; padding: 0 4px;
  }
  #pastPanel h2 .closeBtn:hover { color: var(--text); }
  #pastPanel .item { padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  #pastPanel .item .meta { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  #pastPanel a.pastRow { display: block; color: var(--text); text-decoration: none; margin: 0 -16px; padding: 8px 16px;
    border-bottom: 1px solid var(--line); }
  #pastPanel a.pastRow:hover { background: var(--panel); }
  #pastPanel .topic { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pastPanel .st { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }
  #pastPanel .st.approved { color: var(--ok); border-color: var(--ok); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>MeetSync</h1>
  <form id="f">
    <input type="text" id="url" placeholder="วางลิงก์ Google Meet เพื่อเริ่มแบบเร็ว (หรือสร้างการประชุมพร้อมรายชื่อ →)" autocomplete="off" />
    <button id="startBtn" type="submit">เริ่มประชุม</button>
    <button id="stopBtn" type="button" class="ghost" disabled>หยุดประชุม</button>
  </form>
  <a class="ghost" href="/meeting/new">+ สร้างการประชุม</a>
  <span id="headerMeta">
    <button class="calBtn" id="pastBtn" type="button">ประวัติการประชุม</button>
    <span id="calStatus">กำลังเช็ค Calendar…</span>
    <span id="userBadge"></span>
  </span>
</header>

<nav class="steps" id="steps">
  <span class="step" data-step="link">① เลือก/วางลิงก์</span>
  <span class="step" data-step="run">② กำลังประชุม</span>
  <span class="step" data-step="ended">③ ประชุมจบ → ตรวจทานและทำรายงาน</span>
</nav>

<div class="bar"><span id="status">พร้อมใช้งาน</span><span class="hint" id="hint"></span></div>

<main>
  <div id="pastPanel" hidden></div>
  <div class="actionRow" id="actionRow" hidden>
    <a class="primary" id="workBtn" href="#" hidden>ไปตรวจทาน transcript และทำรายงานการประชุม →</a>
    <button class="ghost" id="dlBtn" type="button">ดาวน์โหลด transcript .txt</button>
  </div>
  <div id="list"><div class="empty">ยังไม่มีคำบรรยาย — วางลิงก์แล้วกด “เริ่มประชุม” หรือสร้างการประชุมพร้อมรายชื่อผู้เข้าร่วมก่อน</div></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const list = $("#list"), statusEl = $("#status"), dot = $("#dot"), hintEl = $("#hint");
const startBtn = $("#startBtn"), stopBtn = $("#stopBtn"), dlBtn = $("#dlBtn"), workBtn = $("#workBtn");
const pastBtn = $("#pastBtn"), pastPanel = $("#pastPanel");
const calStatusEl = $("#calStatus");
const userBadgeEl = $("#userBadge");
const stepsEl = $("#steps"), actionRow = $("#actionRow");

const STEP_ORDER = ["link", "run", "ended"];
const STAGE_HINT = {
  link: "ขั้นตอนที่ 1/3 — วางลิงก์แล้วกด “เริ่มประชุม” หรือสร้างการประชุมพร้อมรายชื่อและบทบาทก่อน",
  run: "ขั้นตอนที่ 2/3 — กำลังบันทึกคำบรรยายสด พูดในที่ประชุมได้เลย",
  ended: "ขั้นตอนที่ 3/3 — ประชุมจบแล้ว ไปตรวจทาน transcript แล้วให้ AI ร่างรายงานการประชุม",
};

function setStage(stage) {
  const idx = STEP_ORDER.indexOf(stage);
  stepsEl.querySelectorAll(".step").forEach((el) => {
    const i = STEP_ORDER.indexOf(el.dataset.step);
    el.classList.toggle("active", i === idx);
    el.classList.toggle("done", i < idx);
  });
  hintEl.textContent = STAGE_HINT[stage] || "";
  actionRow.hidden = stage === "link" || stage === "run";
}

// escape ข้อความที่มาจากภายนอก (ชื่อใน Meet / ข้อมูลจาก DB) ก่อนแทรกใน innerHTML
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadUserBadge() {
  try {
    const res = await fetch("/me");
    if (res.status === 401) { window.location = "/login"; return; }
    const user = await res.json();
    userBadgeEl.innerHTML = `${user.picture ? `<img src="${esc(user.picture)}">` : ""}${esc(user.name)} · <a href="/logout">ออกจากระบบ</a>`;
  } catch {
    userBadgeEl.textContent = "";
  }
}
loadUserBadge();
const rows = new Map();           // id -> {el, name, text, ts}
let running = false;
let lastMeetingId = null;

async function checkCalendarStatus() {
  try {
    const res = await fetch("/calendar/status");
    const data = await res.json();
    calStatusEl.innerHTML = data.connected
      ? "Calendar เชื่อมต่อแล้ว ✓"
      : `<a href="/auth/google">เชื่อมต่อ Google Calendar</a>`;
  } catch {
    calStatusEl.textContent = "";
  }
}

function setRunning(v) {
  const wasRunning = running;
  running = v;
  startBtn.disabled = v;
  stopBtn.disabled = !v;
  dot.classList.toggle("on", v);
  if (v) {
    // เริ่มประชุมใหม่ — ผลของการประชุม "ก่อนหน้า" ต้องกลับไปรอจนคุยจบใหม่อีกครั้ง
    lastMeetingId = null;
    workBtn.hidden = true;
    setStage("run");
  } else if (wasRunning) {
    // เพิ่งกดหยุดจริง ๆ (ไม่ใช่แค่ WS เพิ่งต่อแล้วรายงานว่าไม่ได้ประชุมอยู่)
    setStage("ended");
  }
}

function pad(n) { return String(n).padStart(2, "0"); }
function nowTs() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

function clearList() {
  rows.clear();
  list.innerHTML = '<div class="empty">— ล้างจอแล้ว —</div>';
}

function upsert(ev) {
  const empty = list.querySelector(".empty");
  if (empty) empty.remove();

  let row = rows.get(ev.id);
  const atBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 80;

  if (!row) {
    const el = document.createElement("div");
    el.className = "line";
    el.innerHTML = `<span class="ts"></span><span class="who"></span><span class="txt"></span>`;
    list.appendChild(el);
    row = { el, ts: nowTs() };
    rows.set(ev.id, row);
    el.querySelector(".ts").textContent = "[" + row.ts + "]";
  }
  row.name = ev.name;
  row.text = ev.text;
  row.el.classList.toggle("interim", !ev.final);
  row.el.classList.toggle("raw", ev.name === "(raw)");
  row.el.querySelector(".who").textContent = ev.name === "(raw)" ? "" : ev.name + ": ";
  row.el.querySelector(".txt").textContent = ev.text;

  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
}

// ?start=<meeting_id> มาจากปุ่ม "เริ่มบอท" ในหน้าจัดการการประชุม — ส่งคำสั่งเริ่มครั้งเดียวหลัง WebSocket ต่อติด
const pendingStart = new URLSearchParams(location.search).get("start");
let pendingStartSent = false;
if (pendingStart) {
  history.replaceState(null, "", "/");   // รีเฟรชหน้าแล้วต้องไม่สั่งเริ่มซ้ำ
  setTimeout(async () => {
    try {
      const res = await fetch(`/meetings/${encodeURIComponent(pendingStart)}`);
      if (res.ok) { const d = await res.json(); statusEl.textContent = "กำลังเริ่มการประชุม: " + (d.meeting.title || d.meeting.meet_url); }
    } catch { /* ไม่เป็นไร แค่ข้อความประกอบ */ }
  }, 0);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => {
    dot.classList.remove("err"); statusEl.textContent = "เชื่อมต่อแล้ว";
    if (pendingStart && !pendingStartSent) {
      pendingStartSent = true;
      ws.send(JSON.stringify({ action: "start", meeting_id: Number(pendingStart) }));
    }
  };
  ws.onclose = () => {
    dot.classList.add("err"); dot.classList.remove("on");
    statusEl.textContent = "หลุดการเชื่อมต่อ — กำลังต่อใหม่…";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "caption") upsert(ev);
    else if (ev.type === "status") statusEl.textContent = ev.text;
    else if (ev.type === "error") { statusEl.textContent = "ผิดพลาด: " + ev.text; dot.classList.add("err"); }
    else if (ev.type === "state") setRunning(ev.running);
    else if (ev.type === "cleared") clearList();
    else if (ev.type === "meeting_ended") {
      lastMeetingId = ev.meeting_id;
      workBtn.href = `/meeting/${ev.meeting_id}`;
      workBtn.hidden = false;
    }
  };
  window._ws = ws;
}

function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const STATUS_LABEL = {
  scheduled: "ตั้งค่าไว้", recording: "กำลังบันทึก", transcript_review: "รอตรวจ transcript",
  transcript_verified: "ยืนยัน transcript แล้ว", draft: "ร่างรายงาน", approved: "อนุมัติแล้ว",
};
const PAST_HEADER = `<h2>การประชุม<button class="closeBtn" id="pastCloseBtn" type="button">✕</button></h2>`;

async function loadPastMeetings() {
  pastPanel.hidden = false;
  pastPanel.innerHTML = `${PAST_HEADER}<div class="item meta">กำลังโหลด…</div>`;
  try {
    const res = await fetch("/meetings");
    const meetings = await res.json();
    if (!res.ok) throw new Error(meetings.detail || "โหลดไม่สำเร็จ");
    if (!meetings.length) {
      pastPanel.innerHTML = `${PAST_HEADER}<div class="item meta">— ยังไม่มีการประชุม —</div>`;
      return;
    }
    const items = meetings.map(m => `
      <a class="pastRow" href="/meeting/${m.meeting_id}">
        <span class="meta" style="display:block;color:var(--muted);font-size:12px">${fmtDate(m.started_at)} · ${esc(m.meet_url.replace("https://meet.google.com/", ""))}</span>
        <div class="topic">${esc(m.title || "(ไม่ได้ตั้งชื่อ)")}</div>
        <span class="st ${m.status === "approved" ? "approved" : ""}">${esc(STATUS_LABEL[m.status] || m.status)}</span>
      </a>`).join("");
    pastPanel.innerHTML = `${PAST_HEADER}${items}`;
  } catch (e) {
    pastPanel.innerHTML = `${PAST_HEADER}<div class="item meta">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;
  }
}

pastPanel.addEventListener("click", (e) => {
  if (e.target.id === "pastCloseBtn") pastPanel.hidden = true;
});

pastBtn.addEventListener("click", () => {
  if (!pastPanel.hidden) { pastPanel.hidden = true; return; }
  loadPastMeetings();
});

$("#f").addEventListener("submit", (e) => {
  e.preventDefault();
  const url = $("#url").value.trim();
  if (!url) return;
  localStorage.setItem("meet_url", url);
  window._ws?.send(JSON.stringify({ action: "start", url }));
});
stopBtn.addEventListener("click", () => {
  window._ws?.send(JSON.stringify({ action: "stop" }));
});
dlBtn.addEventListener("click", () => {
  const lines = [...rows.values()].map(r =>
    `[${r.ts}] ${r.name === "(raw)" ? "" : r.name + ": "}${r.text}`);
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `meet-transcript-${Date.now()}.txt`;
  a.click();
});

$("#url").value = localStorage.getItem("meet_url") || "";
setStage("link");
connect();
checkCalendarStatus();
</script>
</body>
</html>
