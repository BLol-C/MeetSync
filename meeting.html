<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MeetSync — จัดการการประชุม</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #4c8dff; --accent-d: #3a6fd8;
    --danger: #ff5c5c; --ok: #37c978; --warn: #f5b83d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI", Tahoma, system-ui, sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center;
    flex-wrap: wrap; background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header a.nav { color: var(--accent); text-decoration: none; font-size: 13px; }
  #userBadge { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #userBadge img { width: 22px; height: 22px; border-radius: 50%; }
  #userBadge a { color: var(--accent); text-decoration: none; }
  .tabs { display: flex; gap: 4px; padding: 8px 18px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tab { font-size: 13px; color: var(--muted); padding: 5px 14px; border-radius: 999px; white-space: nowrap; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .tab.done { color: var(--ok); border-color: var(--ok); }
  .tab.locked { opacity: .45; cursor: not-allowed; }
  main { max-width: 980px; margin: 0 auto; padding: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.f.wide { grid-column: 1 / -1; }
  input, select, textarea { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 10px;
    border-radius: 8px; font: inherit; font-size: 14px; outline: none; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input:disabled, select:disabled, textarea:disabled { opacity: .6; }
  textarea { resize: vertical; min-height: 38px; }
  button, a.btn { border: 0; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { background: var(--accent-d); }
  button.ghost, a.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.ghost:hover, a.btn.ghost:hover { background: var(--line); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); padding: 4px 10px; font-weight: 400; }
  button.small { padding: 3px 10px; font-size: 12px; font-weight: 400; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 400; padding: 4px 6px; }
  td { padding: 4px 6px; vertical-align: top; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 10px; z-index: 20; max-width: 90vw; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast.ok { border-color: var(--ok); }
  .warnlist { margin: 0; padding-left: 18px; font-size: 13px; color: var(--warn); }
  .warnlist li { margin: 2px 0; }
  .seg { display: grid; grid-template-columns: 56px 190px 1fr auto; gap: 8px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg.deleted { opacity: .45; }
  .seg.deleted textarea { text-decoration: line-through; }
  .seg .ts { color: var(--muted); font-size: 12px; padding-top: 8px; }
  @media (max-width: 700px) { .seg { grid-template-columns: 1fr; } }
  .agenda { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: var(--panel2); }
  .agenda .head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .agenda .head .no { font-weight: 600; color: var(--accent); white-space: nowrap; }
  .evid { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .evid .ok { color: var(--ok); } .evid .bad { color: var(--warn); }
  .flag { border-color: var(--warn) !important; }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--panel2); font-size: 14px; }
  .banner.ok { border-color: var(--ok); } .banner.warn { border-color: var(--warn); }
  .people li { margin: 1px 0; }
  .sectionTitle { font-size: 13px; font-weight: 600; color: var(--accent); margin: 14px 0 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .aiview { white-space: pre-wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <a class="nav" href="/">← ประชุมสด</a>
  <h1 id="pageTitle">การประชุม</h1>
  <span class="badge" id="statusBadge"></span>
  <span id="userBadge"></span>
</header>
<nav class="tabs" id="tabs">
  <span class="tab" data-tab="setup">① ตั้งค่า &amp; บอท</span>
  <span class="tab" data-tab="review">② ตรวจ transcript</span>
  <span class="tab" data-tab="report">③ รายงานการประชุม</span>
</nav>
<main>
  <section id="tab-setup"></section>
  <section id="tab-review" hidden></section>
  <section id="tab-report" hidden></section>
</main>
<div id="toast" class="toast" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const ident = location.pathname.split("/").pop();
const isNew = ident === "new";
const meetingId = isNew ? null : Number(ident);

const STATUS_LABEL = {
  scheduled: "ตั้งค่าไว้ ยังไม่เริ่ม", recording: "กำลังบันทึก", transcript_review: "รอตรวจ transcript",
  transcript_verified: "ยืนยัน transcript แล้ว", draft: "รายงานฉบับร่าง", approved: "อนุมัติแล้ว",
};
const ROLE_LABEL = { chair: "ประธาน", secretary: "เลขา", attendee: "ผู้เข้าร่วม" };
const ATT_LABEL = { invited: "ยังไม่ยืนยัน", present: "เข้าร่วม", absent: "ไม่มา" };

let state = null;            // ผลจาก GET /meetings/{id}
let minutesState = null;     // ผลจาก GET /meetings/{id}/minutes
let segments = [];
let activeTab = "setup";
let draftParticipants = [{ display_name: "", email: "", role: "chair", attendance: "present" },
                         { display_name: "", email: "", role: "secretary", attendance: "present" }];  // ใช้เฉพาะหน้า "new"

function toast(msg, kind = "ok") {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast " + kind; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, kind === "err" ? 6000 : 2500);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: body !== undefined ? { "Content-Type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { location = "/login"; throw new Error("ยังไม่ได้เข้าสู่ระบบ"); }
  let data = null;
  try { data = await res.json(); } catch { /* ไม่มี body */ }
  if (!res.ok) {
    const err = new Error(typeof data?.detail === "string" ? data.detail : (data?.detail?.message || "เกิดข้อผิดพลาด"));
    err.status = res.status; err.detail = data?.detail;
    throw err;
  }
  return data;
}

async function guarded(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, "err"); throw e; }
}

(async function userBadge() {
  try {
    const u = await (await fetch("/me")).json();
    $("#userBadge").innerHTML = `${u.picture ? `<img src="${esc(u.picture)}">` : ""}${esc(u.name)} · <a href="/logout">ออกจากระบบ</a>`;
  } catch { /* ไม่เป็นไร */ }
})();

// ───────────── แท็บ ─────────────
function tabAllowed(tab) {
  if (isNew) return tab === "setup";
  const st = state?.meeting.status;
  if (tab === "review") return ["transcript_review", "transcript_verified", "draft", "approved", "recording"].includes(st);
  if (tab === "report") return ["transcript_verified", "draft", "approved"].includes(st) || !!minutesState?.legacy_summary;
  return true;
}

function renderTabs() {
  const st = state?.meeting.status;
  const order = ["setup", "review", "report"];
  document.querySelectorAll(".tab").forEach(el => {
    const t = el.dataset.tab;
    el.classList.toggle("active", t === activeTab);
    el.classList.toggle("locked", !tabAllowed(t));
    el.classList.toggle("done", !isNew && t !== activeTab && (
      (t === "setup" && st && st !== "scheduled") ||
      (t === "review" && ["transcript_verified", "draft", "approved"].includes(st)) ||
      (t === "report" && st === "approved")));
  });
  order.forEach(t => { $("#tab-" + t).hidden = t !== activeTab; });
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const el = e.target.closest(".tab");
  if (!el) return;
  const t = el.dataset.tab;
  if (!tabAllowed(t)) {
    toast(t === "review" ? "ยังไม่มี transcript ให้ตรวจ — เริ่มและหยุดบอทก่อน" : "ต้องยืนยัน transcript ก่อนจึงจะทำรายงานได้", "err");
    return;
  }
  showTab(t);
});

async function showTab(t) {
  activeTab = t;
  renderTabs();
  if (t === "setup") renderSetup();
  if (t === "review") await loadReview();
  if (t === "report") await loadReport();
}

function defaultTab(st) {
  if (["transcript_review", "recording"].includes(st)) return "review";
  if (["transcript_verified", "draft", "approved"].includes(st)) return "report";
  return "setup";
}

async function reloadState() {
  state = await api("GET", `/meetings/${meetingId}`);
  const m = state.meeting;
  $("#pageTitle").textContent = m.title || "การประชุม (ยังไม่ตั้งชื่อ)";
  $("#statusBadge").textContent = STATUS_LABEL[m.status] || m.status;
  $("#statusBadge").className = "badge " + (m.status === "approved" ? "ok" : "");
  document.title = (m.title || "การประชุม") + " — MeetSync";
}

// ───────────── ① ตั้งค่า & บอท ─────────────
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function participantRowHtml(p, i, locked) {
  const idAttr = p.participant_id != null ? `data-pid="${p.participant_id}"` : `data-idx="${i}"`;
  const opt = (map, v) => Object.entries(map).map(([k, l]) => `<option value="${k}" ${k === v ? "selected" : ""}>${l}</option>`).join("");
  return `<tr ${idAttr}>
    <td><input data-f="display_name" value="${esc(p.display_name)}" placeholder="ชื่อ (ตรงกับชื่อที่แสดงใน Meet)" ${locked ? "disabled" : ""}></td>
    <td><input data-f="email" value="${esc(p.email || "")}" placeholder="อีเมล (ใช้เชิญเข้า Calendar)" ${locked ? "disabled" : ""}></td>
    <td><select data-f="role" ${locked ? "disabled" : ""}>${opt(ROLE_LABEL, p.role)}</select></td>
    <td><select data-f="attendance" ${locked ? "disabled" : ""}>${opt(ATT_LABEL, p.attendance)}</select></td>
    <td>${locked ? "" : `<button class="danger" data-act="del" type="button">ลบ</button>`}</td>
  </tr>`;
}

function renderSetup() {
  const root = $("#tab-setup");
  const m = state?.meeting || {};
  const st = m.status;
  const locked = st === "approved";
  const parts = isNew ? draftParticipants : state.participants;
  const urlLocked = !isNew && st !== "scheduled";

  const botCard = isNew ? "" : `
    <div class="card">
      <h2>บอทเข้าห้องประชุม</h2>
      ${st === "scheduled" ? `<p class="muted">ตั้งค่าครบแล้วกดเริ่ม — บอทจะเปิดหน้าต่าง Chrome เข้าห้องและเปิดคำบรรยาย (ถ้ายังไม่ได้ล็อกอิน Google ในหน้าต่างนั้นให้ล็อกอินก่อน และต้องมีคนในห้องกดอนุญาตให้บอทเข้า)</p>` : ""}
      ${st === "recording" ? `<p class="banner warn">กำลังบันทึกอยู่ (หรือบอทหลุดกลางประชุม — กด "กลับไปบันทึกต่อ" ได้ ข้อความที่จับได้แล้วไม่หาย)</p>` : ""}
      ${["transcript_review"].includes(st) ? `<p class="muted">บอทหยุดแล้ว ถ้าประชุมยังไม่จบสามารถกลับไปบันทึกต่อได้</p>` : ""}
      <div class="row">
        ${["scheduled", "recording", "transcript_review"].includes(st) ? `<a class="btn" href="/?start=${meetingId}">${st === "scheduled" ? "▶ เริ่มบอทเข้าห้องประชุม" : "▶ กลับไปบันทึกต่อ / ดูภาพสด"}</a>` : ""}
        ${["recording", "transcript_review"].includes(st) ? `<button class="ghost" id="goReview" type="button">ไปตรวจ transcript →</button>` : ""}
        ${["transcript_verified", "draft", "approved"].includes(st) ? `<button class="ghost" id="goReport" type="button">ไปที่รายงาน →</button>` : ""}
      </div>
    </div>`;

  root.innerHTML = `
    <div class="card">
      <h2>ข้อมูลการประชุม ${locked ? '<span class="badge ok">อนุมัติแล้ว — แก้ไม่ได้</span>' : ""}</h2>
      <div class="grid">
        <label class="f wide">ลิงก์ Google Meet *
          <input id="f_url" value="${esc(m.meet_url || "")}" placeholder="https://meet.google.com/abc-defg-hij" ${urlLocked ? "disabled" : ""}></label>
        <label class="f">เรื่อง / ชื่อการประชุม<input id="f_title" value="${esc(m.title || "")}" placeholder="เช่น ประชุมคณะกรรมการโครงการ" ${locked ? "disabled" : ""}></label>
        <label class="f">หน่วยงาน<input id="f_org" value="${esc(m.org_name || "")}" placeholder="เช่น ภาควิชาวิศวกรรมคอมพิวเตอร์" ${locked ? "disabled" : ""}></label>
        <label class="f">ครั้งที่<input id="f_no" value="${esc(m.meeting_no || "")}" placeholder="เช่น 3/2569" ${locked ? "disabled" : ""}></label>
        <label class="f">สถานที่<input id="f_venue" value="${esc(m.venue || "")}" placeholder="เช่น ห้องประชุม 2 / ออนไลน์ (Google Meet)" ${locked ? "disabled" : ""}></label>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="saveSetup" type="button" ${locked ? "disabled" : ""}>${isNew ? "สร้างการประชุม" : "บันทึกข้อมูล"}</button>
      </div>
    </div>

    <div class="card">
      <h2>ผู้เข้าร่วมประชุมและบทบาท</h2>
      <p class="muted" style="margin-top:0">ใส่ชื่อ <b>ตรงกับชื่อที่แสดงใน Google Meet</b> ระบบจะจับคู่คนพูดกับรายชื่อนี้ให้อัตโนมัติ (ประธานและเลขามีได้อย่างละ 1 คน)
        ประธาน/เลขาที่ใส่อีเมลไว้ จะเข้ามาตรวจและอนุมัติรายงานได้ด้วยบัญชี Google เดียวกัน</p>
      <table><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>บทบาท</th><th>การเข้าร่วม</th><th></th></tr></thead>
        <tbody id="partBody">${parts.map((p, i) => participantRowHtml(p, i, locked)).join("")}</tbody></table>
      <div class="row" style="margin-top:8px">
        ${locked ? "" : `<button class="ghost small" id="addPart" type="button">+ เพิ่มผู้เข้าร่วม</button>`}
        ${locked ? "" : `<button class="ghost small" id="bulkPart" type="button">วางรายชื่อหลายคน</button>`}
      </div>
      ${isNew ? "" : `<div id="partWarn"></div>`}
    </div>
    ${botCard}`;

  $("#saveSetup").onclick = saveSetup;
  $("#addPart")?.addEventListener("click", addParticipantRow);
  $("#bulkPart")?.addEventListener("click", bulkAddParticipants);
  $("#goReview")?.addEventListener("click", () => showTab("review"));
  $("#goReport")?.addEventListener("click", () => showTab("report"));
  const body = $("#partBody");
  body.addEventListener("change", onParticipantChange);
  body.addEventListener("click", onParticipantClick);
  if (!isNew) renderPartWarn();
}

function renderPartWarn() {
  const w = state.header_warnings || [];
  $("#partWarn").innerHTML = w.length
    ? `<ul class="warnlist" style="margin-top:10px">${w.map(x => `<li>${esc(x.message)}</li>`).join("")}</ul>` : "";
}

function readSetupFields() {
  return { meet_url: $("#f_url").value.trim(), title: $("#f_title").value.trim() || null, org_name: $("#f_org").value.trim() || null,
           meeting_no: $("#f_no").value.trim() || null, venue: $("#f_venue").value.trim() || null };
}

async function saveSetup() {
  const f = readSetupFields();
  if (isNew) {
    const participants = draftParticipants.filter(p => p.display_name.trim());
    const r = await guarded(() => api("POST", "/meetings", { ...f, participants }));
    location = `/meeting/${r.meeting_id}`;
    return;
  }
  const body = { ...f }; if (state.meeting.status !== "scheduled") delete body.meet_url;
  state = await guarded(() => api("PATCH", `/meetings/${meetingId}`, body), "บันทึกแล้ว");
  await reloadState(); renderTabs(); renderPartWarn();
}

function addParticipantRow() {
  if (isNew) { draftParticipants.push({ display_name: "", email: "", role: "attendee", attendance: "invited" }); renderSetup(); return; }
  guarded(() => api("POST", `/meetings/${meetingId}/participants`, { display_name: "ผู้เข้าร่วมใหม่", role: "attendee" }))
    .then(async () => { await reloadState(); renderSetup(); }).catch(() => {});
}

function bulkAddParticipants() {
  const text = prompt("วางรายชื่อ บรรทัดละ 1 คน รูปแบบ  ชื่อ,อีเมล  (อีเมลไม่ใส่ก็ได้)");
  if (!text) return;
  const people = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const [name, email] = l.split(",").map(s => s.trim());
    return { display_name: name, email: email || "", role: "attendee", attendance: "invited" };
  });
  if (isNew) { draftParticipants.push(...people); renderSetup(); return; }
  (async () => {
    for (const p of people) { try { await api("POST", `/meetings/${meetingId}/participants`, p); } catch (e) { toast(`${p.display_name}: ${e.message}`, "err"); } }
    await reloadState(); renderSetup();
  })();
}

function onParticipantChange(e) {
  const tr = e.target.closest("tr"); const f = e.target.dataset.f;
  if (!tr || !f) return;
  const value = e.target.value;
  if (tr.dataset.idx != null) { draftParticipants[Number(tr.dataset.idx)][f] = value; return; }
  guarded(() => api("PATCH", `/participants/${tr.dataset.pid}`, { [f]: f === "email" ? (value.trim() || null) : value }))
    .then(async () => { await reloadState(); renderPartWarn(); })
    .catch(async () => { await reloadState(); renderSetup(); });
}

function onParticipantClick(e) {
  if (e.target.dataset.act !== "del") return;
  const tr = e.target.closest("tr");
  if (tr.dataset.idx != null) { draftParticipants.splice(Number(tr.dataset.idx), 1); renderSetup(); return; }
  guarded(() => api("DELETE", `/participants/${tr.dataset.pid}`))
    .then(async () => { await reloadState(); renderSetup(); }).catch(() => {});
}

// ───────────── ② ตรวจ transcript ─────────────
async function loadReview() {
  const root = $("#tab-review");
  root.innerHTML = `<div class="card muted">กำลังโหลด…</div>`;
  await reloadState();
  segments = await api("GET", `/meetings/${meetingId}/segments`);
  renderReview();
}

function knownNames() {
  const names = new Set(state.participants.map(p => p.display_name));
  state.speakers.forEach(s => names.add(s.display_name));
  return [...names];
}

function renderReview() {
  const root = $("#tab-review");
  const st = state.meeting.status;
  const editable = st === "transcript_review";
  const unlinked = state.speakers.filter(s => s.participant_id == null && s.segment_count);

  const speakerRows = state.speakers.map(s => `
    <tr data-sid="${s.speaker_id}">
      <td>${esc(s.display_name)} <span class="muted">(${s.segment_count} ช่วง)</span></td>
      <td><select data-act="link" ${["approved"].includes(st) ? "disabled" : ""}>
        <option value="">— ยังไม่จับคู่ —</option>
        ${state.participants.map(p => `<option value="${p.participant_id}" ${p.participant_id === s.participant_id ? "selected" : ""}>${esc(p.display_name)} (${ROLE_LABEL[p.role]})</option>`).join("")}
      </select></td></tr>`).join("");

  const absentNote = state.participants.filter(p => p.attendance === "invited").length;

  root.innerHTML = `
    ${st === "recording" ? `<div class="banner warn">บอทยังบันทึกการประชุมนี้อยู่ — หยุดบอทที่หน้า "ประชุมสด" ก่อนจึงจะตรวจทานและยืนยันได้</div>` : ""}
    ${["transcript_verified", "draft"].includes(st) ? `<div class="banner ok">ยืนยัน transcript แล้ว ${st === "draft" ? "(มีรายงานฉบับร่างแล้ว — ถ้ากลับไปแก้ transcript รายงานเดิมจะล้าสมัยและต้องให้ AI สร้างใหม่)" : ""}
      <button class="ghost small" id="reopen" type="button" style="margin-left:8px">กลับไปแก้ transcript</button></div>` : ""}
    ${st === "approved" ? `<div class="banner ok">รายงานอนุมัติแล้ว — transcript ถูกล็อก</div>` : ""}

    <div class="card">
      <h2>จับคู่ชื่อใน Meet กับผู้เข้าร่วม ${unlinked.length ? `<span class="badge warn">ยังไม่จับคู่ ${unlinked.length} ชื่อ</span>` : '<span class="badge ok">จับคู่ครบ</span>'}</h2>
      <p class="muted" style="margin-top:0">คนที่จับคู่แล้วและมีเสียงพูดจะถูกนับว่า "เข้าร่วม" อัตโนมัติ ส่วนคนที่ไม่มีเสียงพูดแต่เข้าฟัง ให้ไปตั้ง "เข้าร่วม" เองที่แท็บ ① (ที่ยังไม่ยืนยันจะแสดงเป็นผู้ไม่มาประชุมในรายงาน${absentNote ? ` — ตอนนี้มี ${absentNote} คน` : ""})</p>
      <table><tbody>${speakerRows || '<tr><td class="muted">ยังไม่มีผู้พูด</td></tr>'}</tbody></table>
      <div class="row" style="margin-top:8px"><button class="ghost small" id="autoLink" type="button">จับคู่อัตโนมัติอีกครั้ง</button></div>
    </div>

    <div class="card">
      <h2>ข้อความที่บอทจับได้ (${segments.filter(s => !s.deleted).length} ช่วง)
        <input id="segSearch" placeholder="ค้นหา…" style="max-width:200px;margin-left:auto"></h2>
      <p class="muted" style="margin-top:0">${editable ? "แก้ข้อความที่ถอดผิด/ชื่อคนพูดผิด หรือลบช่วงที่ไม่เกี่ยวข้อง — การแก้บันทึกอัตโนมัติเมื่อคลิกออกจากช่อง ข้อความต้นฉบับยังเก็บไว้" : "ดูอย่างเดียวในสถานะนี้"}</p>
      <datalist id="names">${knownNames().map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      <div id="segList">${segments.map(s => segHtml(s, editable)).join("") || '<div class="muted">ยังไม่มีข้อความ</div>'}</div>
    </div>

    <div class="card">
      <div class="row">
        ${editable ? `<button id="verify" type="button">✓ ยืนยัน transcript (ปลดล็อกให้ AI สร้างรายงาน)</button>` : ""}
        ${["transcript_verified", "draft", "approved"].includes(st) ? `<button id="goReport2" type="button">ไปที่รายงาน →</button>` : ""}
        <a class="btn ghost" href="/meetings/${meetingId}/transcript.txt" download>ดาวน์โหลด .txt</a>
      </div>
      ${editable ? `<p class="muted" style="margin-bottom:0">ระบบจะไม่ให้ AI สรุปจนกว่าคุณจะกดยืนยัน เพื่อให้แน่ใจว่าคนตรวจข้อความที่ AI จะใช้แล้ว</p>` : ""}
    </div>`;

  $("#reopen")?.addEventListener("click", async () => {
    if (st === "draft" && !confirm("รายงานฉบับร่างที่มีอยู่จะล้าสมัย ต้องให้ AI สร้างใหม่หลังแก้เสร็จ ดำเนินการต่อ?")) return;
    await guarded(() => api("POST", `/meetings/${meetingId}/reopen-transcript`)); await loadReview(); renderTabs();
  });
  $("#verify")?.addEventListener("click", verifyTranscript);
  $("#goReport2")?.addEventListener("click", () => showTab("report"));
  $("#autoLink").onclick = async () => {
    const r = await guarded(() => api("POST", `/meetings/${meetingId}/auto-link`));
    toast(`จับคู่เพิ่ม ${r.linked} ชื่อ`); await loadReview();
  };
  root.querySelectorAll("select[data-act=link]").forEach(sel => sel.addEventListener("change", async () => {
    const sid = sel.closest("tr").dataset.sid;
    try { await api("PUT", `/meetings/${meetingId}/speakers/${sid}/participant`, { participant_id: sel.value ? Number(sel.value) : null }); toast("บันทึกแล้ว"); }
    catch (e) { toast(e.message, "err"); }
    await loadReview();
  }));
  $("#segSearch").addEventListener("input", filterSegs);
  $("#segList").addEventListener("change", onSegChange);
  $("#segList").addEventListener("click", onSegClick);
}

function segHtml(s, editable) {
  const t = new Date(s.spoken_at); const p = (n) => String(n).padStart(2, "0");
  return `<div class="seg ${s.deleted ? "deleted" : ""}" data-id="${s.segment_id}" data-text="${esc((s.display_name + " " + s.text).toLowerCase())}">
    <div class="ts">${p(t.getHours())}:${p(t.getMinutes())}</div>
    <input list="names" data-f="speaker_name" value="${esc(s.display_name)}" ${editable && !s.deleted ? "" : "disabled"}>
    <div><textarea data-f="text" rows="${Math.min(6, Math.max(1, Math.ceil(s.text.length / 70)))}" ${editable && !s.deleted ? "" : "disabled"}>${esc(s.text)}</textarea>
      ${s.original_text ? `<div class="muted" title="${esc(s.original_text)}">✎ แก้ไขแล้ว — ต้นฉบับ: ${esc(s.original_text.slice(0, 80))}${s.original_text.length > 80 ? "…" : ""}</div>` : ""}</div>
    <div>${editable ? `<button class="danger small" data-act="${s.deleted ? "restore" : "delete"}" type="button">${s.deleted ? "กู้คืน" : "ลบ"}</button>` : ""}</div>
  </div>`;
}

function filterSegs() {
  const q = $("#segSearch").value.trim().toLowerCase();
  document.querySelectorAll("#segList .seg").forEach(el => { el.hidden = q && !el.dataset.text.includes(q); });
}

async function onSegChange(e) {
  const row = e.target.closest(".seg"); const f = e.target.dataset.f;
  if (!row || !f) return;
  const orig = segments.find(s => s.segment_id === Number(row.dataset.id));
  const value = e.target.value.trim();
  if ((f === "text" && value === orig.text) || (f === "speaker_name" && value === orig.display_name)) return;
  try { await api("PATCH", `/segments/${row.dataset.id}`, { [f]: value }); toast("บันทึกแล้ว"); }
  catch (err) { toast(err.message, "err"); e.target.value = f === "text" ? orig.text : orig.display_name; return; }
  const scroll = window.scrollY; await loadReview(); window.scrollTo(0, scroll);
}

async function onSegClick(e) {
  const act = e.target.dataset.act; if (!act) return;
  const id = e.target.closest(".seg").dataset.id;
  try { await api("PATCH", `/segments/${id}`, { deleted: act === "delete" }); }
  catch (err) { toast(err.message, "err"); return; }
  const scroll = window.scrollY; await loadReview(); window.scrollTo(0, scroll);
}

async function verifyTranscript() {
  const unlinked = state.speakers.filter(s => s.participant_id == null && s.segment_count).length;
  if (unlinked && !confirm(`ยังมี ${unlinked} ชื่อที่ไม่ได้จับคู่กับผู้เข้าร่วม (AI จะระบุผู้รับผิดชอบงานให้คนเหล่านี้ไม่ได้) ยืนยัน transcript ต่อไปไหม?`)) return;
  await guarded(() => api("POST", `/meetings/${meetingId}/verify-transcript`), "ยืนยัน transcript แล้ว");
  await reloadState(); renderTabs(); await showTab("report");
}

// ───────────── ③ รายงาน ─────────────
let content = null;     // เนื้อหารายงานที่กำลังแก้
let dirty = false;

async function loadReport() {
  const root = $("#tab-report");
  root.innerHTML = `<div class="card muted">กำลังโหลด…</div>`;
  await reloadState();
  minutesState = await api("GET", `/meetings/${meetingId}/minutes`);
  content = minutesState.minutes ? JSON.parse(JSON.stringify(minutesState.minutes.content)) : null;
  dirty = false;
  renderReport();
}

function warnFor(path) { return (content?.warnings || []).filter(w => w.path === path); }
function flagCls(path) { return warnFor(path).length ? "flag" : ""; }

function headerCardHtml() {
  const h = minutesState.header;
  const list = (arr) => arr.length ? `<ul class="people" style="margin:2px 0 0;padding-left:18px">${arr.map(p => `<li>${esc(p.name)}${p.role !== "attendee" ? ` <span class="muted">(${ROLE_LABEL[p.role]})</span>` : ""}${p.unconfirmed ? ' <span class="badge warn">ยังไม่ยืนยัน</span>' : ""}</li>`).join("")}</ul>` : '<span class="muted"> — ไม่มี</span>';
  return `<div class="card">
    <h2>ส่วนหัวรายงาน <span class="muted" style="font-weight:400">(มาจากข้อมูลในระบบ ไม่ได้มาจาก AI)</span>
      <button class="ghost small" id="toSetup" type="button" style="margin-left:auto">แก้ที่แท็บ ①</button></h2>
    <div class="grid">
      <div><b>${esc(h.title)}</b>${h.org_name ? `<div class="muted">${esc(h.org_name)}</div>` : ""}</div>
      <div class="muted">${h.meeting_no ? `ครั้งที่ ${esc(h.meeting_no)} · ` : ""}${esc(h.date_text)}${h.start_time ? ` · ${h.start_time}${h.end_time ? "–" + h.end_time : ""} น.` : ""}${h.venue ? ` · ${esc(h.venue)}` : ""}</div>
      <div>ประธาน: ${h.chair ? esc(h.chair) : '<span class="badge warn">ยังไม่กำหนด</span>'}</div>
      <div>เลขา: ${h.secretary ? esc(h.secretary) : '<span class="badge warn">ยังไม่กำหนด</span>'}</div>
      <div>ผู้มาประชุม ${list(h.attendees)}</div><div>ผู้ไม่มาประชุม ${list(h.absent)}</div>
    </div></div>`;
}

function agendaHtml(a, i, ro) {
  const g = a.grounded;
  const evid = (a.evidence || []).length
    ? `<div class="evid">อ้างอิง ${g === true ? '<span class="ok">✓ พบใน transcript</span>' : g === false ? '<span class="bad">⚠ ไม่พบใน transcript</span>' : ""}: ${(a.evidence || []).map(e => `“${esc(e)}”`).join(" ")}</div>`
    : (a.resolution ? '<div class="evid"><span class="bad">⚠ มติไม่มีข้อความอ้างอิง</span></div>' : "");
  return `<div class="agenda" data-i="${i}">
    <div class="head"><span class="no">วาระที่ ${i + 1}</span>
      <input data-k="title" value="${esc(a.title)}" placeholder="ชื่อวาระ" class="${flagCls(`agenda[${i}].title`)}" ${ro ? "disabled" : ""}>
      ${ro ? "" : `<button class="danger small" data-act="del-agenda" type="button">ลบ</button>`}</div>
    <label class="f">สาระสำคัญ<textarea data-k="discussion" rows="3" ${ro ? "disabled" : ""}>${esc(a.discussion)}</textarea></label>
    <label class="f" style="margin-top:6px">มติที่ประชุม (เว้นว่าง = เพื่อทราบ/ยังไม่มีมติ)
      <textarea data-k="resolution" rows="2" class="${flagCls(`agenda[${i}].resolution`)}" ${ro ? "disabled" : ""}>${esc(a.resolution || "")}</textarea></label>
    ${evid}</div>`;
}

function actionRowHtml(a, i, ro, saved) {
  const names = state.participants.map(p => p.display_name);
  const opts = ['<option value="">— ไม่ระบุ —</option>', ...names.map(n => `<option ${n === a.assignee ? "selected" : ""}>${esc(n)}</option>`)];
  if (a.assignee && !names.includes(a.assignee)) opts.push(`<option selected>${esc(a.assignee)}</option>`);
  const g = a.grounded;
  return `<tr data-i="${i}">
    <td><textarea data-k="description" rows="2" class="${flagCls(`action_items[${i}].description`)}" ${ro ? "disabled" : ""}>${esc(a.description)}</textarea>
      <div class="evid">${g === true ? '<span class="ok">✓ พบใน transcript</span>' : g === false ? '<span class="bad">⚠ อ้างอิงไม่พบใน transcript</span>' : '<span class="bad">⚠ ไม่มีข้อความอ้างอิง</span>'}
      ${(a.evidence || []).map(e => ` “${esc(e)}”`).join("")}</div></td>
    <td><select data-k="assignee" class="${flagCls(`action_items[${i}].assignee`)}" ${ro ? "disabled" : ""}>${opts.join("")}</select></td>
    <td><input type="date" data-k="due_date" value="${esc(a.due_date || "")}" class="${flagCls(`action_items[${i}].due_date`)}" ${ro ? "disabled" : ""}></td>
    <td><input type="time" data-k="due_time" value="${esc(a.due_time || "")}" ${ro ? "disabled" : ""}> –
        <input type="time" data-k="due_time_end" value="${esc(a.due_time_end || "")}" class="${flagCls(`action_items[${i}].due_time_end`)}" ${ro ? "disabled" : ""}></td>
    <td>${ro ? (saved ? (saved.calendar_synced ? '<span class="badge ok">อยู่ใน Calendar</span>' : "") : "") : `<button class="danger small" data-act="del-action" type="button">ลบ</button>`}</td>
  </tr>`;
}

function renderReport() {
  const root = $("#tab-report");
  const st = state.meeting.status;
  const m = minutesState.minutes;
  const approved = st === "approved";
  const ro = !minutesState.editable;       // แก้ได้เฉพาะสถานะ draft
  const canGen = ["transcript_verified", "draft"].includes(st);

  if (!m) {
    const legacy = minutesState.legacy_summary;
    root.innerHTML = `
      ${headerCardHtml()}
      <div class="card">
        <h2>รายงานการประชุม</h2>
        ${canGen ? `<p class="muted">ให้ AI (Gemini) ร่างรายงานจาก transcript ที่ยืนยันแล้ว — ผลที่ได้เป็น "ฉบับร่าง" ที่คุณต้องตรวจ/แก้ก่อนอนุมัติ</p>
          <button id="gen" type="button">✨ ให้ AI ร่างรายงาน</button>` : `<p class="muted">ต้องยืนยัน transcript ในแท็บ ② ก่อน</p>`}
      </div>
      ${legacy ? `<div class="card"><h2>สรุปแบบเก่า (ก่อนมีรายงานการประชุม)</h2><p>${esc(legacy.executive_summary)}</p>
        <a class="btn ghost" href="/meetings/${meetingId}/summary.pdf" download>PDF สรุปแบบเก่า</a></div>` : ""}`;
    $("#gen")?.addEventListener("click", generate);
    $("#toSetup")?.addEventListener("click", () => showTab("setup"));
    return;
  }

  const allWarn = [...(content.warnings || []), ...(minutesState.header_warnings || [])];
  const savedItems = minutesState.action_items || [];
  const aiOpen = m.ai_content ? `<details style="margin-top:10px"><summary>ดูฉบับที่ AI ร่างไว้เดิม (เทียบกับที่แก้)</summary><div class="aiview">${
    esc(`สรุป: ${m.ai_content.summary}\n\n` + (m.ai_content.agenda || []).map((a, i) => `วาระ ${i + 1}: ${a.title}\n  ${a.discussion}\n  มติ: ${a.resolution || "—"}`).join("\n\n"))}</div></details>` : "";

  root.innerHTML = `
    ${approved ? `<div class="banner ok">✓ อนุมัติแล้วโดย ${esc(m.approved_by_name || "-")} เมื่อ ${m.approved_at ? new Date(m.approved_at).toLocaleString("th-TH") : "-"} (เวอร์ชัน ${m.version})</div>`
      : `<div class="banner warn">ฉบับร่าง (เวอร์ชัน ${m.version}) — ตรวจและแก้ให้ถูกต้องก่อนอนุมัติ · PDF ที่ดาวน์โหลดตอนนี้จะมีลายน้ำ "ฉบับร่าง"</div>`}
    ${headerCardHtml()}
    ${!approved && allWarn.length ? `<div class="card"><h2>สิ่งที่ควรตรวจก่อนอนุมัติ (${allWarn.length})</h2>
      <ul class="warnlist">${allWarn.map(w => `<li>${esc(w.message)}</li>`).join("")}</ul></div>` : ""}

    <div class="card">
      <h2>สรุปภาพรวม</h2>
      <textarea id="r_summary" rows="4" ${ro ? "disabled" : ""}>${esc(content.summary)}</textarea>
      <div class="sectionTitle">ระเบียบวาระ ${ro ? "" : '<button class="ghost small" id="addAgenda" type="button" style="margin-left:8px">+ เพิ่มวาระ</button>'}</div>
      <div id="agendaList">${content.agenda.map((a, i) => agendaHtml(a, i, ro)).join("") || '<div class="muted">ไม่มีวาระ</div>'}</div>
      <div class="sectionTitle">เรื่องอื่น ๆ</div>
      <textarea id="r_other" rows="2" ${ro ? "disabled" : ""}>${esc(content.other_matters || "")}</textarea>
      ${aiOpen}
    </div>

    <div class="card">
      <h2>งานที่ได้รับมอบหมาย ${ro ? "" : '<button class="ghost small" id="addAction" type="button" style="margin-left:8px">+ เพิ่มงาน</button>'}</h2>
      <table><thead><tr><th>งาน / นัดหมาย</th><th>ผู้รับผิดชอบ</th><th>วันที่</th><th>เวลา (เริ่ม–จบ)</th><th></th></tr></thead>
        <tbody id="actionList">${content.action_items.map((a, i) => actionRowHtml(a, i, ro, savedItems[i])).join("") || '<tr><td class="muted" colspan="5">ไม่มีงาน</td></tr>'}</tbody></table>
    </div>

    <div class="card">
      <div class="row">
        ${!ro ? `<button id="saveDraft" type="button">💾 บันทึกร่าง</button>` : ""}
        ${canGen && !approved ? `<button class="ghost" id="gen" type="button">✨ ให้ AI ร่างใหม่ (เป็นเวอร์ชันใหม่)</button>` : ""}
        ${!approved ? `<button id="approve" type="button" style="background:var(--ok)">✓ อนุมัติรายงาน</button>` : `<button class="ghost" id="revise" type="button">✎ สร้างเวอร์ชันแก้ไข</button>`}
        <a class="btn ghost" href="/meetings/${meetingId}/minutes.pdf" download>⬇ PDF${approved ? "" : " (ฉบับร่าง)"}</a>
      </div>
    </div>

    ${approved ? calendarCardHtml(savedItems) : ""}`;

  $("#toSetup")?.addEventListener("click", () => showTab("setup"));
  $("#gen")?.addEventListener("click", generate);
  $("#saveDraft")?.addEventListener("click", saveDraft);
  $("#approve")?.addEventListener("click", approve);
  $("#revise")?.addEventListener("click", revise);
  $("#addAgenda")?.addEventListener("click", () => { syncFromDom(); content.agenda.push({ title: "", discussion: "", resolution: "", evidence: [], grounded: null }); dirty = true; renderReport(); });
  $("#addAction")?.addEventListener("click", () => { syncFromDom(); content.action_items.push({ description: "", assignee: "", due_date: "", due_time: "", due_time_end: "", evidence: [], grounded: null }); dirty = true; renderReport(); });
  root.addEventListener("input", () => { dirty = true; }, { once: true });
  $("#agendaList")?.addEventListener("click", (e) => { if (e.target.dataset.act === "del-agenda") { syncFromDom(); content.agenda.splice(Number(e.target.closest(".agenda").dataset.i), 1); dirty = true; renderReport(); } });
  $("#actionList")?.addEventListener("click", (e) => { if (e.target.dataset.act === "del-action") { syncFromDom(); content.action_items.splice(Number(e.target.closest("tr").dataset.i), 1); dirty = true; renderReport(); } });
  $("#calConnect")?.addEventListener("click", () => { location = `/auth/google?return=${encodeURIComponent(location.pathname)}`; });
  $("#syncAll")?.addEventListener("click", syncAll);
}

function calendarCardHtml(items) {
  const withDate = items.filter(i => i.due_date).length;
  return `<div class="card"><h2>ส่งงานเข้า Google Calendar</h2>
    ${state.calendar_connected
      ? `<p class="muted" style="margin-top:0">ส่งเฉพาะงานที่มีวันที่ (${withDate}/${items.length}) เข้าปฏิทินของคุณ ผู้รับผิดชอบที่มีอีเมลในรายชื่อจะถูกเพิ่มเป็นผู้ร่วมงาน
          (ไม่ส่งอีเมลเชิญ เว้นแต่ตั้ง CALENDAR_SEND_INVITES=1)</p>
         <button id="syncAll" type="button" ${items.length ? "" : "disabled"}>📅 ส่งงานทั้งหมดเข้า Calendar</button>`
      : `<p class="muted" style="margin-top:0">ยังไม่ได้เชื่อมต่อ Google Calendar ของบัญชีนี้</p><button id="calConnect" type="button">เชื่อมต่อ Google Calendar</button>`}
  </div>`;
}

function syncFromDom() {
  if (!content || minutesState.editable === false) return;
  content.summary = $("#r_summary")?.value ?? content.summary;
  content.other_matters = $("#r_other")?.value ?? content.other_matters;
  document.querySelectorAll("#agendaList .agenda").forEach(el => {
    const a = content.agenda[Number(el.dataset.i)]; if (!a) return;
    el.querySelectorAll("[data-k]").forEach(inp => { a[inp.dataset.k] = inp.value; });
  });
  document.querySelectorAll("#actionList tr[data-i]").forEach(el => {
    const a = content.action_items[Number(el.dataset.i)]; if (!a) return;
    el.querySelectorAll("[data-k]").forEach(inp => { a[inp.dataset.k] = inp.value; });
  });
}

function payloadFromContent() {
  syncFromDom();
  const nz = (v) => (v === "" || v == null ? null : v);
  return {
    summary: content.summary, other_matters: nz(content.other_matters),
    agenda: content.agenda.map(a => ({ title: a.title, discussion: a.discussion, resolution: nz(a.resolution), evidence: a.evidence || [] })),
    action_items: content.action_items.map(a => ({
      description: a.description, assignee: nz(a.assignee), due_date: nz(a.due_date), due_time: nz(a.due_time),
      due_time_end: nz(a.due_time_end), evidence: a.evidence || [] })),
  };
}

async function saveDraft(silent) {
  const r = await guarded(() => api("PUT", `/meetings/${meetingId}/minutes`, { content: payloadFromContent() }), silent === true ? null : "บันทึกร่างแล้ว");
  content = r.content; dirty = false;
  minutesState.minutes.content = r.content; renderReport();
}

async function generate() {
  if (minutesState?.minutes && !confirm("จะสร้างรายงานฉบับร่างเวอร์ชันใหม่จาก AI (ฉบับที่แก้ไว้ยังอยู่ในประวัติ แต่หน้านี้จะแสดงฉบับใหม่) ดำเนินการต่อ?")) return;
  const btn = $("#gen"); btn.disabled = true; btn.textContent = "AI กำลังร่างรายงาน… (อาจใช้เวลา 10–60 วินาที)";
  try { await api("POST", `/meetings/${meetingId}/minutes/generate`); toast("AI ร่างรายงานเสร็จแล้ว — ตรวจสอบก่อนอนุมัติ"); }
  catch (e) { toast(e.message, "err"); btn.disabled = false; btn.textContent = "✨ ให้ AI ร่างรายงาน"; return; }
  await loadReport(); renderTabs();
}

async function approve() {
  if (dirty) await saveDraft(true);
  try { await api("POST", `/meetings/${meetingId}/minutes/approve`, { confirm_warnings: false }); }
  catch (e) {
    if (e.status === 409 && e.detail?.warnings) {
      const list = e.detail.warnings.map(w => "• " + w.message).join("\n");
      if (!confirm(`ยังมีรายการที่ควรตรวจก่อนอนุมัติ:\n\n${list}\n\nตรวจแล้วและต้องการอนุมัติต่อไปไหม?`)) return;
      try { await api("POST", `/meetings/${meetingId}/minutes/approve`, { confirm_warnings: true }); }
      catch (e2) { toast(e2.message, "err"); return; }
    } else { toast(e.message, "err"); return; }
  }
  toast("อนุมัติรายงานแล้ว"); await loadReport(); renderTabs();
}

async function revise() {
  if (!confirm("สร้างเวอร์ชันแก้ไขจากรายงานที่อนุมัติแล้ว? (เวอร์ชันที่อนุมัติยังอยู่ในประวัติ และต้องอนุมัติใหม่หลังแก้)")) return;
  await guarded(() => api("POST", `/meetings/${meetingId}/minutes/revise`), "สร้างเวอร์ชันแก้ไขแล้ว");
  await loadReport(); renderTabs();
}

async function syncAll() {
  const r = await guarded(() => api("POST", `/meetings/${meetingId}/calendar/sync-all`));
  const ok = r.results.filter(x => x.ok).length, bad = r.results.filter(x => !x.ok);
  toast(`ส่งเข้า Calendar แล้ว ${ok} รายการ` + (bad.length ? ` · ส่งไม่ได้ ${bad.length}: ${bad[0].error}` : ""), bad.length ? "err" : "ok");
  await loadReport();
}

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// ───────────── เริ่มต้น ─────────────
(async function init() {
  if (isNew) { $("#pageTitle").textContent = "สร้างการประชุมใหม่"; renderTabs(); renderSetup(); return; }
  try {
    await reloadState();
    minutesState = await api("GET", `/meetings/${meetingId}/minutes`);
  } catch (e) { $("#tab-setup").innerHTML = `<div class="card">${esc(e.message)} <a href="/">กลับหน้าหลัก</a></div>`; return; }
  await showTab(defaultTab(state.meeting.status));
})();
</script>
